name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.2.0 (created if it does not exist)"
        required: true

permissions:
  contents: write

# One resolved tag for both trigger styles: the pushed tag, or the
# manual run's input.
env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the release commit
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9][A-Za-z0-9.-]*)?$ ]] || ! git check-ref-format "refs/tags/$TAG"; then
            echo "::error::Release tag must be a semantic version such as v1.2.3 or v1.2.3-rc.1."
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          elif [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            SHA="$RUN_SHA"
          else
            echo "::error::The pushed release tag could not be resolved."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: resolve-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Must run before the per-arch builds below: it embeds
      # Transom.app.tar.gz into internal/macapp/bundle, which the `transom`
      # binaries built next need to have go:embed'd.
      - name: Build macOS app bundle
        run: VERSION="${TAG#v}" bash macapp/build.sh

      - name: Build (arm64 + amd64)
        run: |
          GOARCH=arm64 go build -trimpath -ldflags "-s -w -X transom/internal/version.Number=${TAG#v}" -o transom-arm64 .
          GOARCH=amd64 go build -trimpath -ldflags "-s -w -X transom/internal/version.Number=${TAG#v}" -o transom-amd64 .

      - name: Package
        run: |
          mkdir -p pkg-arm64 pkg-amd64
          cp transom-arm64 pkg-arm64/transom
          cp transom-amd64 pkg-amd64/transom
          tar -czf "transom-${TAG}-darwin-arm64.tar.gz" -C pkg-arm64 transom
          tar -czf "transom-${TAG}-darwin-amd64.tar.gz" -C pkg-amd64 transom
          # -c -k --keepParent preserves the code-signature seal and xattrs,
          # unlike zip/Compress-Archive.
          ditto -c -k --keepParent macapp/build/Transom.app "Transom-${TAG}-macos.zip"
          shasum -a 256 transom-*.tar.gz Transom-*.zip > checksums.txt

      - name: Validate Homebrew cask for both architectures
        env:
          HOMEBREW_DEVELOPER: "1"
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ANALYTICS: "1"
        run: |
          VERSION="${TAG#v}"
          ARM_SHA=$(shasum -a 256 "transom-${TAG}-darwin-arm64.tar.gz" | cut -d' ' -f1)
          AMD_SHA=$(shasum -a 256 "transom-${TAG}-darwin-amd64.tar.gz" | cut -d' ' -f1)
          sed -e "s/@TAG@/${TAG}/g" \
              -e "s/@VERSION@/${VERSION}/g" \
              -e "s/@ARM_SHA@/${ARM_SHA}/g" \
              -e "s/@AMD_SHA@/${AMD_SHA}/g" \
              packaging/homebrew/transom.rb.tmpl > transom.rb
          brew ruby packaging/homebrew/validate-cask.rb transom.rb \
            "transom-${TAG}-darwin-arm64.tar.gz" "transom-${TAG}-darwin-amd64.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            transom-*.tar.gz
            Transom-*.zip
            checksums.txt

  release:
    needs: [resolve-release, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ needs.resolve-release.outputs.sha }}
          files: |
            transom-*.tar.gz
            Transom-*.zip
            checksums.txt
          generate_release_notes: true

  homebrew-tap:
    needs: release
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
