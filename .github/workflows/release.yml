name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.2.0 (created if it does not exist)"
        required: true

permissions:
  contents: write

# One resolved tag for both trigger styles: the pushed tag, or the
# manual run's input.
env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Must run before the per-arch builds below: it embeds
      # Transom.app.tar.gz into internal/macapp/bundle, which the `transom`
      # binaries built next need to have go:embed'd.
      - name: Build macOS app bundle
        run: VERSION="${TAG#v}" bash macapp/build.sh

      - name: Build (arm64 + amd64)
        run: |
          GOARCH=arm64 go build -trimpath -ldflags "-s -w -X transom/internal/version.Number=${TAG#v}" -o transom-arm64 .
          GOARCH=amd64 go build -trimpath -ldflags "-s -w -X transom/internal/version.Number=${TAG#v}" -o transom-amd64 .

      - name: Package
        run: |
          mkdir -p pkg-arm64 pkg-amd64
          cp transom-arm64 pkg-arm64/transom
          cp transom-amd64 pkg-amd64/transom
          tar -czf "transom-${TAG}-darwin-arm64.tar.gz" -C pkg-arm64 transom
          tar -czf "transom-${TAG}-darwin-amd64.tar.gz" -C pkg-amd64 transom
          # -c -k --keepParent preserves the code-signature seal and xattrs,
          # unlike zip/Compress-Archive.
          ditto -c -k --keepParent macapp/build/Transom.app "Transom-${TAG}-macos.zip"
          shasum -a 256 transom-*.tar.gz Transom-*.zip > checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            transom-*.tar.gz
            Transom-*.zip
            checksums.txt

  release:
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            transom-*.tar.gz
            Transom-*.zip
            checksums.txt
          generate_release_notes: true

  homebrew-tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: macos

      - name: Update the tap formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN secret not set — skipping the Homebrew tap update."
            exit 0
          fi
          VERSION="${TAG#v}"
          ARM_SHA=$(sha256sum "transom-${TAG}-darwin-arm64.tar.gz" | cut -d' ' -f1)
          AMD_SHA=$(sha256sum "transom-${TAG}-darwin-amd64.tar.gz" | cut -d' ' -f1)
          sed -e "s/@TAG@/${TAG}/g" \
              -e "s/@VERSION@/${VERSION}/g" \
              -e "s/@ARM_SHA@/${ARM_SHA}/g" \
              -e "s/@AMD_SHA@/${AMD_SHA}/g" \
              packaging/homebrew/transom.rb.tmpl > transom.rb
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/anabiiil/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp transom.rb tap/Formula/transom.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/transom.rb
          git diff --cached --quiet || git commit -m "transom ${TAG}"
          git push
